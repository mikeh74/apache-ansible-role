---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache (Ubuntu/Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Python3 and systemd for Ubuntu containers
      ansible.builtin.raw: |
        apt-get update && \
        apt-get install -y python3 python3-apt systemd && \
        systemctl set-default multi-user.target
      when:
        - ansible_os_family == "Debian"
        - ansible_python_interpreter is not defined
      changed_when: false

  roles:
    - role: mhorrocks.apache
      apache_remove_default_vhost: true
      apache_create_vhosts: true
