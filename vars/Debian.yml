---
# Debian/Ubuntu specific variables

apache_packages:
  - apache2
  - apache2-utils

apache_service: apache2

apache_config_path: /etc/apache2
apache_sites_available_path: /etc/apache2/sites-available
apache_sites_enabled_path: /etc/apache2/sites-enabled
apache_mods_available_path: /etc/apache2/mods-available
apache_mods_enabled_path: /etc/apache2/mods-enabled

apache_user: www-data
apache_group: www-data

apache_log_dir: /var/log/apache2
apache_pid_file: /var/run/apache2/apache2.pid
